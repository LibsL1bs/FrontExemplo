<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso do cliente</title>
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <main>
      <h1>Acesso do cliente</h1>
      <p>Acesse sua conta usando nome, CPF e senha.</p>
      <form id="loginCliente">
        <label for="nome_cliente"
          >Nome<input
            id="nome_cliente"
            type="text"
            placeholder="Digite seu nome"
            required
        /></label>
        <label for="cpf_cliente"
          >CPF<input
            id="cpf_cliente"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="000.000.000-00"
            maxlength="14"
            required
        /></label>
        <label for="senha_cliente"
          >Senha<input
            id="senha_cliente"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
        /></label>
        <button id="entrar" type="submit">Entrar</button>
      </form>
      <p id="mensagem" role="status" aria-live="polite"></p>
      <a href="./cadastro.html">Ainda não tenho cadastro</a>
      <a href="./login-funcionario.html">Acesso do funcionário</a>
    </main>
    <script src="./script/loginuser.js"></script>
  </body>
</html>
