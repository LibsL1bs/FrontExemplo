<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar veículo</title>
    <link rel="stylesheet" href="./css/homeuser.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <div>
          <span class="eyebrow">Área do cliente</span>
          <h1 id="titulo">Cadastrar veículo</h1>
        </div>
        <button id="logout" type="button">Sair</button>
      </header>

      <section class="panel">
        <h2>Novo veículo</h2>
        <p class="intro">Informe os dados do veículo para vinculá-lo ao seu cadastro.</p>
        <form id="veiculoForm">
          <label for="placa">Placa
            <input id="placa" name="placa" type="text" maxlength="10" placeholder="ABC1D23" required />
          </label>
          <label for="marca">Marca
            <input id="marca" name="marca" type="text" placeholder="Toyota" required />
          </label>
          <label for="modelo">Modelo
            <input id="modelo" name="modelo" type="text" placeholder="Corolla" required />
          </label>
          <label for="ano">Ano
            <input id="ano" name="ano" type="number" min="1900" max="2100" placeholder="2024" required />
          </label>
          <label for="cor">Cor
            <input id="cor" name="cor" type="text" placeholder="Prata" required />
          </label>
          <button id="cadastrarVeiculo" type="submit">Cadastrar veículo</button>
          <p id="mensagem" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="./script/homeuser.js"></script>
  </body>
</html>
