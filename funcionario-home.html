<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão da oficina</title>
    <link rel="stylesheet" href="./css/funcionario-home.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <span class="eyebrow">Gestão da oficina</span>
          <h1 id="titulo">Área do funcionário</h1>
          <p id="bemVindo">Olá, funcionário.</p>
        </div>
        <button id="logout" type="button">Sair</button>
      </header>

      <section class="panel">
        <h2>Veículos por cliente</h2>
        <label for="clienteConsulta">Cliente</label>
        <select id="clienteConsulta"></select>
        <div id="listaVeiculos" class="list"></div>
      </section>

      <section class="panel">
        <h2>Histórico de manutenções</h2>
        <label for="veiculoHistorico">Veículo</label>
        <select id="veiculoHistorico"></select>
        <div id="listaHistorico" class="list"></div>
      </section>

      <section class="panel">
        <h2>Registrar manutenção</h2>
        <form id="formManutencao" class="form-card">
          <label>Veículo<select id="veiculoManutencao" required></select></label>
          <label>Data de entrada<input id="dataManutencao" type="date" required /></label>
          <label>Descrição do problema<textarea id="descricaoManutencao" required></textarea></label>
          <label>Tipo de serviço<input id="tipoManutencao" type="text" placeholder="Ex.: Revisão, freios" required /></label>
          <label>Situação
            <select id="situacaoManutencao" required>
              <option value="aguardando">Aguardando</option>
              <option value="em andamento">Em andamento</option>
              <option value="concluída">Concluída</option>
            </select>
          </label>
          <label>Valor<input id="valorManutencao" type="number" min="0" step="0.01" required /></label>
          <label>Data de entrega <span>(preencha quando concluída)</span><input id="dataEntrega" type="date" /></label>
          <button class="primary-btn" type="submit">Registrar manutenção</button>
        </form>
        <p id="mensagem" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="./script/funcionario-home.js"></script>
  </body>
</html>
