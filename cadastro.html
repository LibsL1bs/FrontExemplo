<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro do cliente</title>
    <link rel="stylesheet" href="./css/cadastro.css" />
  </head>
  <body>
    <main>
      <h1>Cadastro</h1>
      <p>Cadastre seus dados para acompanhar seus veículos.</p>

      <form id="cadastroCliente">
        <label for="nome_cliente">
          Nome
          <input id="nome_cliente" type="text" placeholder="Digite seu nome" required />
        </label>

        <label for="cpf_cliente">
          CPF
          <input id="cpf_cliente" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required />
        </label>

        <label for="telefone_cliente">
          Telefone
          <input id="telefone_cliente" type="tel" placeholder="(00) 00000-0000" />
        </label>

        <label for="endereco_cliente">
          Endereço
          <input id="endereco_cliente" type="text" placeholder="Digite seu endereço" />
        </label>

        <label for="senha_cliente">
          Senha
          <input id="senha_cliente" type="password" placeholder="Digite sua senha" required />
        </label>

        <label for="confirmar_senha">
          Confirmar senha
          <input
            id="confirmar_senha"
            type="password"
            placeholder="Confirme sua senha"
          />
        </label>

        <button id="cadastrar" type="button">Cadastrar</button>
      </form>

      <div class="atalhos">
        <a href="./loginuser.html">Já tenho cadastro</a>
        <a href="./login-funcionario.html">Acesso do funcionário</a>
      </div>
    </main>

    <script src="./script/cadastro.js"></script>
  </body>
</html>
